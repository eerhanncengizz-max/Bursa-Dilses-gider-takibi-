<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b60"><link rel="manifest" href="./manifest.webmanifest"><title>Okul Gider Takibi</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#18283d;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border:1px solid #e3e9f0;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:22px;color:#173b60}h2{font-size:18px}.muted{color:#718096;font-size:13px}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea,button{font:inherit;width:100%;padding:12px;border:1px solid #d6deea;border-radius:10px;background:white}button{background:#173b60;color:white;border:0;font-weight:650;cursor:pointer;margin-top:10px}.secondary{background:#e9eef5;color:#173b60}.danger{background:#b83b3b}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#edf3f9;border-radius:12px;padding:13px}.stat b{display:block;font-size:22px;margin-top:6px}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{width:auto;white-space:nowrap;background:#e9eef5;color:#173b60}.tabs button.active{background:#173b60;color:white}.hidden{display:none!important}.notice{padding:12px;background:#edf4fb;border-radius:10px;margin:10px 0}.error{background:#fff0f0;color:#992e2e}.success{background:#eaf7ef;color:#205d39}.item{padding:12px 0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:10px}.item:last-child{border:0}.pill{font-size:12px;background:#edf2f7;border-radius:20px;padding:4px 8px}.bar{height:8px;background:#e7edf4;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#387eae}.right{text-align:right}@media(max-width:580px){main{padding:10px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.grid{grid-template-columns:1fr}}
</style></head><body><main><header class="row"><div><h1>🏫 Okul Gider Takibi</h1><div class="muted">Ortak okul giderleri · iPhone uyumlu</div></div><button id="logout" class="secondary hidden" style="width:auto">Çıkış</button></header><div id="message" class="notice hidden"></div>
<section id="auth" class="card"><h2>Giriş / Hesap oluştur</h2><label>E-posta</label><input id="email" type="email" autocomplete="email" required placeholder="ornek@okul.com"><label>Şifre</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="En az 6 karakter"><label class="remember"><input id="rememberMe" type="checkbox" checked style="width:auto;margin-right:8px"> Beni hatırla</label><div class="grid"><button id="login">Giriş yap</button><button id="signup" class="secondary">Hesap oluştur</button></div></section>
<section id="app" class="hidden"><div class="card"><div class="row"><div><b id="user"></b><div class="muted">Bağlı okul</div></div><select id="schoolSelect" style="max-width:190px"></select></div></div>
<div id="schoolSetup" class="card hidden"><h2>Okulunu bağla</h2><label>Yeni okul adı</label><input id="schoolName" placeholder="Okul adı"><button id="createSchool">Okul oluştur</button><label>Mevcut okul davet kodu</label><input id="inviteCode" placeholder="Davet kodu"><button id="joinSchool" class="secondary">Davet koduyla katıl</button></div>
<div id="workspace" class="hidden"><div class="stats"><div class="stat"><span class="muted">Bu ay harcama</span><b id="total">₺0</b></div><div class="stat"><span class="muted">Bu ay işlem</span><b id="count">0</b></div><div class="stat"><span class="muted">Üye</span><b id="memberCount">0</b></div></div>
<nav class="tabs"><button class="active" data-tab="list">Giderler</button><button data-tab="add">Gider ekle</button><button data-tab="budget">Bütçe</button><button data-tab="report">Rapor</button><button data-tab="settings">Ayarlar</button></nav>
<section id="tab-list" class="card"><div class="row"><h2>Gider kayıtları</h2><button id="csv" class="secondary" style="width:auto">CSV indir</button></div><div id="records"></div><h3>Kategori dağılımı</h3><div id="categories"></div></section>
<section id="tab-add" class="card hidden"><h2>Yeni gider</h2><form id="expenseForm"><div class="grid"><div><label>Tarih</label><input id="date" type="date" required></div><div><label>Tutar (₺)</label><input id="amount" type="number" min=".01" step=".01" required></div><div><label>Kategori</label><select id="category"><option>Kırtasiye</option><option>Temizlik</option><option>Gıda</option><option>Bakım / Onarım</option><option>Elektrik / Su</option><option>Eğitim Materyali</option><option>Ulaşım</option><option>Diğer</option></select></div><div><label>Ödeme yöntemi</label><select id="payment"><option>Nakit</option><option>Kredi Kartı</option><option>Havale / EFT</option><option>Diğer</option></select></div></div><label>Açıklama</label><input id="description" required><label>Harcamayı yapan</label><input id="spentBy"><label>Not</label><textarea id="note"></textarea><label>Fiş / fatura</label><input id="receipt" type="file" accept="image/*,.pdf"><button>Kaydet</button></form></section>
<section id="tab-budget" class="card hidden"><h2>Aylık bütçe</h2><label>Ay</label><input id="budgetMonth" type="month"><label>Bütçe (₺)</label><input id="budgetAmount" type="number" min="0" step=".01"><button id="saveBudget">Bütçeyi kaydet</button><div id="budgetInfo"></div></section>
<section id="tab-report" class="card hidden"><h2>Rapor</h2><div class="grid"><div><label>Başlangıç</label><input id="from" type="date"></div><div><label>Bitiş</label><input id="to" type="date"></div></div><div id="reportInfo"></div><button id="print" class="secondary">Yazdır / PDF kaydet</button></section>
<section id="tab-settings" class="card hidden"><h2>Okul ayarları</h2><div id="schoolInfo"></div><button id="invite" class="adminOnly">Davet kodu oluştur</button><div id="inviteResult"></div><h3>Üyeler</h3><div id="members"></div></section></div></section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id);const pref=localStorage.getItem('okul-gider-remember')!=='false';$('rememberMe').checked=pref;const authStorage={getItem:async k=>localStorage.getItem(k)??sessionStorage.getItem(k),setItem:async(k,v)=>{const target=$('rememberMe').checked?localStorage:sessionStorage,other=target===localStorage?sessionStorage:localStorage;target.setItem(k,v);other.removeItem(k)},removeItem:async k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)}};const db=createClient('https://wjrafgdjthrvknchfpoy.supabase.co','sb_publishable_EQMZMe27bb9ytqVnc-8SRw_pQFNSkZR',{auth:{storage:authStorage,storageKey:'okul-gider-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});$('rememberMe').onchange=async()=>{localStorage.setItem('okul-gider-remember',$('rememberMe').checked?'true':'false');const token=await authStorage.getItem('okul-gider-auth');if(token)await authStorage.setItem('okul-gider-auth',token)};let user,schools=[],school,role='member',expenses=[],members=[],budgets=[],channel,editingExpenseId=null;
const today=()=>new Date().toISOString().slice(0,10),month=()=>today().slice(0,7),money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(+n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function q(p){let{data,error}=await p;if(error)throw error;return data}function say(t,k='notice'){ $('message').className='notice '+k;$('message').textContent=t;$('message').classList.remove('hidden')}
$('date').value=today();$('expenseForm').onsubmit=async ev=>{ev.preventDefault();try{let path=editingExpenseId?(expenses.find(x=>x.id===editingExpenseId)?.receipt_path||null):null,f=$('receipt').files[0];if(f){if(f.size>10*1024*1024)throw new Error('Fiş/fatura dosyası en fazla 10 MB olabilir.');if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(f.type))throw new Error('Yalnızca JPG, PNG, WEBP veya PDF dosyası yükleyebilirsiniz.');path=school.id+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^\\w.-]/g,'_');await q(db.storage.from('school-receipts').upload(path,f))}const payload={expense_date:$('date').value,amount:+$('amount').value,category:$('category').value,description:$('description').value,payment_method:$('payment').value,spent_by:$('spentBy').value,note:$('note').value,receipt_path:path};if(editingExpenseId){if(role!=='admin')throw new Error('Yönetici yetkisi gerekli.');await q(db.from('school_expenses').update(payload).eq('id',editingExpenseId).eq('school_id',school.id));editingExpenseId=null;say('Gider güncellendi.','success')}else{await q(db.from('school_expenses').insert({...payload,school_id:school.id}));say('Harcama kaydedildi.','success')}ev.target.reset();$('date').value=today();$('expenseForm').querySelector('button[type=submit],button:not([type])').textContent='Kaydet';await loadSchool();tab('list')}catch(e){say(e.message,'error')}};
$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){say('Lütfen e-posta adresinizi ve şifrenizi girin.','error');return}try{await q(db.auth.signInWithPassword({email,password}));await boot()}catch(e){say(e.message,'error')}};
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email){say('Hesap açmak için önce e-posta adresinizi yazın.','error');$('email').focus();return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){say('Geçerli bir e-posta adresi girin.','error');$('email').focus();return}if(password.length<6){say('Şifreniz en az 6 karakter olmalı.','error');$('password').focus();return}try{const result=await q(db.auth.signUp({email,password}));say(result.session?'Hesap oluşturuldu, giriş yapıldı.':'Hesap oluşturuldu. E-posta doğrulaması açıksa gelen bağlantıyı onaylayın.','success');if(result.session)await boot()}catch(e){say(e.message,'error')}};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function boot(){let{data:{session}}=await db.auth.getSession();user=session?.user;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(!user)return;$('user').textContent=user.email;await loadSchools()}
async function loadSchools(){try{let a=await q(db.from('school_members').select('school_id,role,schools(id,name)').eq('user_id',user.id));schools=a.map(x=>({id:x.school_id,name:x.schools.name,role:x.role}));$('schoolSelect').innerHTML=schools.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('schoolSetup').classList.toggle('hidden',schools.length>0);$('workspace').classList.toggle('hidden',!schools.length);if(schools.length){school=schools.find(x=>x.id===$('schoolSelect').value)||schools[0];$('schoolSelect').value=school.id;await loadSchool()}}catch(e){say(e.message,'error')}}
$('schoolSelect').onchange=async()=>{school=schools.find(x=>x.id===$('schoolSelect').value);await loadSchool()};
$('createSchool').onclick=async()=>{try{await q(db.rpc('create_school',{school_name:$('schoolName').value.trim()}));await loadSchools();say('Okul oluşturuldu. İkinci telefonu davet koduyla bağlayın.','success')}catch(e){say(e.message,'error')}};
$('joinSchool').onclick=async()=>{try{await q(db.rpc('join_school',{invite:$('inviteCode').value.trim()}));await loadSchools();say('Okula katıldınız.','success')}catch(e){say(e.message,'error')}};
async function loadSchool(){role=school.role;let[a,b,c]=await Promise.all([q(db.from('school_expenses').select('*').eq('school_id',school.id).order('expense_date',{ascending:false})),q(db.from('school_members').select('user_id,role').eq('school_id',school.id)),q(db.from('school_budgets').select('*').eq('school_id',school.id))]);expenses=a;members=b;budgets=c;render();if(channel)await db.removeChannel(channel);channel=db.channel('school-'+school.id).on('postgres_changes',{event:'*',schema:'public',table:'school_expenses',filter:'school_id=eq.'+school.id},()=>loadSchool()).subscribe()}
function row(e){return '<div class="item"><div><b>'+esc(e.description||e.category)+'</b><div class="muted">'+esc(e.expense_date)+' · '+esc(e.category)+' · '+esc(e.payment_method)+'</div>'+(e.note?'<div class="muted">'+esc(e.note)+'</div>':'')+(e.receipt_path?'<a href="#" data-file="'+esc(e.receipt_path)+'">Fiş / faturayı aç</a>':'')+'</div><div class="right"><b>'+money(e.amount)+'</b>'+(role==='admin'?'<button class="secondary" data-edit="'+e.id+'" style="padding:7px;margin-top:6px">Düzenle</button><button class="danger" data-del="'+e.id+'" style="padding:7px;margin-top:6px">Sil</button>':'')+'</div></div>'}
function render(){let m=month(),a=expenses.filter(x=>x.expense_date.startsWith(m)),sum=a.reduce((s,x)=>s+ +x.amount,0);$('total').textContent=money(sum);$('count').textContent=a.length;$('memberCount').textContent=members.length;$('records').innerHTML=expenses.map(row).join('')||'<p class="muted">Henüz kayıt yok.</p>';let cats={};a.forEach(x=>cats[x.category]=(cats[x.category]||0)+ +x.amount);$('categories').innerHTML=Object.entries(cats).map(([k,v])=>'<p>'+esc(k)+' <b style="float:right">'+money(v)+'</b></p><div class="bar"><span style="width:'+v/(sum||1)*100+'%"></span></div>').join('')||'<p class="muted">Bu ay kayıt yok.</p>';$('schoolInfo').innerHTML='<b>'+esc(school.name)+'</b> · '+(role==='admin'?'Yönetici':'Üye');$('members').innerHTML=members.map(x=>'<div class="item"><span>'+(x.user_id===user.id?'Sen':x.user_id.slice(0,8)+'…')+' <span class="pill">'+(x.role==='admin'?'Yönetici':'Üye')+'</span></span>'+(role==='admin'&&x.role==='member'?'<button class="danger" data-member-del="'+x.user_id+'" style="width:auto;padding:7px">Üyeyi çıkar</button>':'')+'</div>').join('');document.querySelectorAll('.adminOnly').forEach(x=>x.classList.toggle('hidden',role!=='admin'));$('budgetMonth').value=m;let b=budgets.find(x=>x.month.slice(0,7)===m);$('budgetAmount').value=b?.amount??'';$('budgetAmount').disabled=role!=='admin';budgetRender();reportRender()}
document.addEventListener('click',async ev=>{let ed=ev.target.closest('[data-edit]');if(ed){if(role!=='admin')return;const e=expenses.find(x=>x.id===ed.dataset.edit);if(!e)return;editingExpenseId=e.id;$('date').value=e.expense_date;$('amount').value=e.amount;$('category').value=e.category;$('description').value=e.description||'';$('payment').value=e.payment_method;$('spentBy').value=e.spent_by||'';$('note').value=e.note||'';$('receipt').value='';$('expenseForm').querySelector('button[type=submit],button:not([type])').textContent='Değişiklikleri kaydet';tab('add');say('Gider düzenleme modunda.','notice')}let md=ev.target.closest('[data-member-del]');if(md){if(role!=='admin'||!confirm('Bu üyeyi okuldan çıkarmak istiyor musunuz?'))return;try{await q(db.from('school_members').delete().eq('school_id',school.id).eq('user_id',md.dataset.memberDel));await loadSchools();say('Üye okuldan çıkarıldı.','success')}catch(e){say(e.message,'error')}}let d=ev.target.closest('[data-del]');if(d){if(!confirm('Bu gider silinsin mi?'))return;try{await q(db.from('school_expenses').delete().eq('id',d.dataset.del));await loadSchool()}catch(e){say(e.message,'error')}}let f=ev.target.closest('[data-file]');if(f){ev.preventDefault();try{let x=await q(db.storage.from('school-receipts').createSignedUrl(f.dataset.file,120));window.open(x.signedUrl,'_blank')}catch(e){say(e.message,'error')}}});

$('saveBudget').onclick=async()=>{try{await q(db.from('school_budgets').upsert({school_id:school.id,month:$('budgetMonth').value+'-01',amount:+$('budgetAmount').value,created_by:user.id},{onConflict:'school_id,month'}));await loadSchool();say('Bütçe kaydedildi.','success')}catch(e){say(e.message,'error')}};
function budgetRender(){let spent=expenses.filter(x=>x.expense_date.startsWith(month())).reduce((s,x)=>s+ +x.amount,0),b=budgets.find(x=>x.month.slice(0,7)===month()),limit=+(b?.amount||0),p=limit?Math.min(100,spent/limit*100):0;$('budgetInfo').innerHTML='<p>Harcanan: <b>'+money(spent)+'</b> · Bütçe: <b>'+money(limit)+'</b></p><div class="bar"><span style="width:'+p+'%"></span></div><p class="muted">'+(limit?'%'+p.toFixed(0)+' kullanıldı · Kalan '+money(limit-spent):'Henüz bütçe belirlenmedi')+'</p>'}
function reportRender(){let f=$('from').value,t=$('to').value,a=expenses.filter(x=>(!f||x.expense_date>=f)&&(!t||x.expense_date<=t));$('reportInfo').innerHTML='<h2>'+money(a.reduce((s,x)=>s+ +x.amount,0))+'</h2>'+a.map(row).join('')}
$('from').onchange=reportRender;$('to').onchange=reportRender;$('print').onclick=()=>window.print();
$('csv').onclick=()=>{let a=[['Tarih','Tutar','Kategori','Açıklama','Ödeme','Harcamayı yapan','Not'],...expenses.map(x=>[x.expense_date,x.amount,x.category,x.description,x.payment_method,x.spent_by,x.note])],s='\ufeff'+a.map(r=>r.map(v=>{let z=String(v??'');if(/^[=+@\-	\r]/.test(z))z="'"+z;return '"'+z.replace(/"/g,'""')+'"'}).join(';')).join('\n'),u=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'})),l=document.createElement('a');l.href=u;l.download='okul-giderleri.csv';l.click();URL.revokeObjectURL(u)};
$('invite').onclick=async()=>{try{let c=await q(db.rpc('create_school_invite',{target_school:school.id}));$('inviteResult').textContent='Davet kodu: '+c+' (30 gün geçerli)'}catch(e){say(e.message,'error')}};
function tab(t){document.querySelectorAll('[id^="tab-"]').forEach(x=>x.classList.add('hidden'));$('tab-'+t).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));if(t==='report')reportRender();if(t==='budget')budgetRender()}document.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>tab(x.dataset.tab));db.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
