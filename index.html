<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174c3c"><link rel="manifest" href="manifest.webmanifest"><title>Okul Gider Takibi</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18231f;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}header{background:#174c3c;color:white;padding:24px 18px 28px}header h1{margin:0;font-size:24px}header p{margin:7px 0 0;opacity:.85}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:17px;margin:0 0 14px;box-shadow:0 2px 12px #183d2910}h2{font-size:18px;margin:0 0 14px}label{display:block;font-size:13px;font-weight:650;margin:11px 0 5px}input,select,button{font:inherit;width:100%;padding:12px;border:1px solid #d5ded8;border-radius:10px;background:white}button{background:#174c3c;color:white;border:0;font-weight:700;margin-top:12px}button.secondary{background:#e8f0eb;color:#174c3c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:flex;gap:10px}.stat{flex:1;background:#edf4ef;border-radius:12px;padding:13px}.stat b{display:block;font-size:22px;color:#174c3c}.muted{color:#65736b;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #edf0ed;padding:12px 0}.row:first-child{border-top:0}.hidden{display:none}.danger{background:#9b332b}.small{font-size:12px}a{color:#174c3c}
</style></head><body><header><h1>Okul Gider Takibi</h1><p>Ortak okul harcamaları • Makbuz • Aylık rapor</p></header><main class="wrap">
<section class="card" id="auth"><h2>Giriş / Kayıt</h2><label>E-posta</label><input id="email" type="email" placeholder="ornek@mail.com"><label>Şifre</label><input id="password" type="password" placeholder="En az 6 karakter"><button id="login">Giriş yap</button><button class="secondary" id="signup">Yeni hesap oluştur</button><p class="muted" id="authmsg">İki telefonda da aynı hesapla giriş yapın; kayıtlar ortak görünür.</p></section>
<div id="app" class="hidden">
<section class="card"><div class="row" style="border:0;padding-top:0"><div><b id="who"></b><div class="muted">Oturum açık</div></div><button class="secondary" id="logout" style="width:auto;margin:0">Çıkış</button></div><div class="stats"><div class="stat"><span class="muted">Bu ay toplam</span><b id="total">₺0</b></div><div class="stat"><span class="muted">Kayıt sayısı</span><b id="count">0</b></div></div></section>
<section class="card"><h2>Yeni gider ekle</h2><div class="grid"><div><label>Tarih</label><input id="date" type="date"></div><div><label>Tutar (₺)</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0,00"></div></div><label>Kategori</label><select id="category"><option>Kırtasiye</option><option>Temizlik</option><option>Gıda / İkram</option><option>Etkinlik</option><option>Ulaşım</option><option>Bakım / Onarım</option><option>Diğer</option></select><label>Açıklama</label><input id="description" placeholder="Ne alındı?"><div class="grid"><div><label>Ödeme yöntemi</label><select id="payment"><option>Kredi kartı</option><option>Nakit</option><option>Banka kartı</option><option>Havale / EFT</option><option>Diğer</option></select></div><div><label>Harcamayı yapan</label><input id="spentby" placeholder="Ad soyad"></div></div><label>Fiş / Makbuz fotoğrafı</label><input id="receipt" type="file" accept="image/*"><button id="save">Gideri kaydet</button><p class="muted" id="savemsg"></p></section>
<section class="card"><div class="row" style="border:0;padding-top:0"><h2 style="margin:0">Gider kayıtları</h2><button id="export" class="secondary" style="width:auto;margin:0">Excel için CSV indir</button></div><div id="records"><p class="muted">Kayıtlar yükleniyor…</p></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL="https://wjrafgdjthrvknchfpoy.supabase.co", SB_KEY="sb_publishable_EQMZMe27bb9ytqVnc-8SRw_pQFNSkZR";
const db=window.supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id);let expenses=[];
$("date").value=new Date().toISOString().slice(0,10);
function msg(t){$("authmsg").textContent=t}function money(n){return new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(n||0)}
async function session(){const {data:{session}}=await db.auth.getSession();show(session);db.auth.onAuthStateChange((_e,s)=>show(s))}
function show(s){$("auth").classList.toggle("hidden",!!s);$("app").classList.toggle("hidden",!s);if(s){$("who").textContent=s.user.email;load()}}
$("login").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});msg(error?error.message:"Giriş yapıldı.")};
$("signup").onclick=async()=>{const {error}=await db.auth.signUp({email:$("email").value,password:$("password").value});msg(error?error.message:"Kayıt isteği gönderildi. E-posta doğrulaması istenirse gelen kutunuzu kontrol edin.")};
$("logout").onclick=()=>db.auth.signOut();
async function load(){const {data,error}=await db.from("expenses").select("*").order("expense_date",{ascending:false});if(error){$("records").textContent="Kayıtlar alınamadı: "+error.message;return}expenses=data||[];render()}
function render(){const month=new Date().toISOString().slice(0,7);const current=expenses.filter(x=>(x.expense_date||"").startsWith(month));$("total").textContent=money(current.reduce((a,x)=>a+Number(x.amount),0));$("count").textContent=current.length;$("records").innerHTML=expenses.length?expenses.map(x=>'<div class="row"><div><b>'+esc(x.description||x.category)+'</b><div class="muted">'+esc(x.expense_date)+' · '+esc(x.category)+' · '+esc(x.spent_by||"")+'</div><div class="muted">'+esc(x.payment_method||"")+(x.receipt_path?' · <a target="_blank" href="'+esc(x.receipt_path)+'">Fiş</a>':'')+'</div></div><b>'+money(x.amount)+'</b></div>').join(""):'<p class="muted">Henüz gider eklenmemiş.</p>'}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("save").onclick=async()=>{const {data:{user}}=await db.auth.getUser();const amount=Number($("amount").value);if(!amount||amount<=0){$("savemsg").textContent="Geçerli bir tutar girin.";return}let path=null;const f=$("receipt").files[0];if(f){const ext=(f.name.split(".").pop()||"jpg").toLowerCase();const name=user.id+"/"+Date.now()+"."+ext;const up=await db.storage.from("receipt-images").upload(name,f,{upsert:false});if(up.error){$("savemsg").textContent="Fiş yüklenemedi: "+up.error.message;return}const signed=await db.storage.from("receipt-images").createSignedUrl(name,60*60*24*365);path=signed.data?.signedUrl||null}
const row={expense_date:$("date").value,amount,category:$("category").value,description:$("description").value,payment_method:$("payment").value,spent_by:$("spentby").value,receipt_path:path,created_by:user.id};const {error}=await db.from("expenses").insert(row);$("savemsg").textContent=error?"Kaydedilemedi: "+error.message:"Gider kaydedildi.";if(!error){$("amount").value="";$("description").value="";$("receipt").value="";load()}};
$("export").onclick=()=>{const rows=[["Tarih","Tutar","Kategori","Açıklama","Ödeme yöntemi","Harcamayı yapan"],...expenses.map(x=>[x.expense_date,x.amount,x.category,x.description,x.payment_method,x.spent_by])];const csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="okul-giderleri.csv";a.click();URL.revokeObjectURL(a.href)};
db.channel("expense-changes").on("postgres_changes",{event:"*",schema:"public",table:"expenses"},load).subscribe();session();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
